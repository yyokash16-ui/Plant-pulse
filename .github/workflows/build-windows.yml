name: Build PlantPulse Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python bridge server
        run: python -m py_compile server.py
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file Windows application
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PlantPulse --add-data "index.html;." --add-data "manifest.webmanifest;." --add-data "icon.svg;." --add-data "sw.js;." server.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PlantPulse-Windows
          path: dist/PlantPulse.exe
          if-no-files-found: error
          retention-days: 30
