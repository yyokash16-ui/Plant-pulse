name: Build PlantPulse Windows App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python bridge server
        run: python -m py_compile server.py
      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content index.html -Raw
          $scripts = [regex]::Matches($html, '(?is)<script[^>]*>(.*?)</script>')
          $i = 0
          foreach ($script in $scripts) {
            $source = $script.Groups[1].Value
            if ($source.Trim()) {
              $temp = Join-Path $env:TEMP ("plantpulse-script-" + $i + ".js")
              Set-Content -Path $temp -Value $source -Encoding utf8
              node --check $temp
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $i++
            }
          }
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file Windows application
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PlantPulse --add-data "index.html;." --add-data "manifest.webmanifest;." --add-data "icon.svg;." --add-data "sw.js;." server.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PlantPulse-Windows
          path: dist/PlantPulse.exe
          if-no-files-found: error
          retention-days: 30
